# Tuned for a laptop with 8 GB of RAM: one Gradle process, Kotlin compiled in-process, few workers.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
# Fallback limit in case a Kotlin daemon is still started (e.g. by kotlin-dsl).
kotlin.daemon.jvmargs=-Xmx768m

android.useAndroidX=true
android.nonTransitiveRClass=true
