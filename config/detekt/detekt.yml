# Overrides on top of the default detekt configuration (buildUponDefaultConfig = true).
config:
  validation: true
  warningsAsErrors: true

build:
  maxIssues: 0

naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Z0-9]*'

complexity:
  LongParameterList:
    ignoreDefaultParameters: true
    ignoreAnnotated:
      - Composable
  LongMethod:
    ignoreAnnotated:
      - Composable

style:
  ReturnCount:
    max: 3
    excludeGuardClauses: true
  UnusedPrivateMember:
    ignoreAnnotated:
      - Preview
  MagicNumber:
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
      - '**/*.kts'
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  ForbiddenComment:
    active: true
  MaxLineLength:
    maxLineLength: 120
